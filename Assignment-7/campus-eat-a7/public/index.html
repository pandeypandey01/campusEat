<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CampusEats · Menu</title>
<style>
  body { font-family: system-ui, sans-serif; background: #faf6f0; color: #222; margin: 0; }
  main { max-width: 560px; margin: 2rem auto; padding: 0 1rem; }
  h1 { color: #c2410c; }
  ul { list-style: none; padding: 0; }
  li { background: #fff; border-radius: 8px; padding: .75rem 1rem; margin-bottom: .5rem;
       display: flex; justify-content: space-between; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  .off { opacity: .5; }
  .badge { font-size: .8rem; color: #666; }
  form { display: flex; gap: .5rem; margin-top: 1rem; }
  input { flex: 1; padding: .5rem; border: 1px solid #ccc; border-radius: 6px; }
  button { background: #c2410c; color: #fff; border: 0; border-radius: 6px; padding: .5rem 1rem; cursor: pointer; }
  #msg { color: #b91c1c; min-height: 1.2em; }
</style>
</head>
<body>
<main>
  <h1>CampusEats Menu</h1>
  <ul id="list"></ul>
  <form id="add">
    <input id="name" placeholder="Dish name" required>
    <input id="price" type="number" step="0.01" min="0" placeholder="Price" required>
    <button type="submit">Add dish</button>
  </form>
  <p id="msg"></p>
</main>
<script>
const ENDPOINT = '/graphql';

async function gql(query, variables) {
  const res = await fetch(ENDPOINT, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ query, variables }),
  });
  const json = await res.json();
  if (json.errors) throw new Error(json.errors[0].message);
  return json.data;
}

async function load() {
  const data = await gql('query { dishes { id name price available } }');
  const list = document.getElementById('list');
  list.innerHTML = '';
  for (const d of data.dishes) {
    const li = document.createElement('li');
    if (!d.available) li.className = 'off';
    const left = document.createElement('span');
    left.textContent = d.name;
    const right = document.createElement('span');
    right.innerHTML = '<span class="badge">' + (d.available ? '' : 'sold out · ') + '</span>';
    right.append('₹' + d.price.toFixed(2));
    li.append(left, right);
    list.appendChild(li);
  }
}

document.getElementById('add').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('msg');
  msg.textContent = '';
  try {
    await gql(
      'mutation($input: AddDishInput!) { addDish(input: $input) { id name price } }',
      { input: { name: document.getElementById('name').value, price: parseFloat(document.getElementById('price').value) } }
    );
    e.target.reset();
    await load();
  } catch (err) { msg.textContent = err.message; }
});

load().catch(err => document.getElementById('msg').textContent = err.message);
</script>
</body>
</html>
